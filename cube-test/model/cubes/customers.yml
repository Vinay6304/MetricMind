cubes:
  - name: customers
    sql_table: "\"ANALYTICS\".\"CUSTOMERS\""
    data_source: default

    joins: []

    dimensions:
      - name: city
        sql: "{CUBE}.\"CITY\""
        type: string

      - name: country
        sql: "{CUBE}.\"COUNTRY\""
        type: string

      - name: customer_name
        sql: "{CUBE}.\"CUSTOMER_NAME\""
        type: string

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

